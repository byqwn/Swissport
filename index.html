<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح سريع وبسيط</title>
    <!-- مكتبة Tesseract فقط -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f8f9fa; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        video { width: 100%; border-radius: 8px; border: 2px solid #333; }
        button { padding: 14px; font-size: 1.1rem; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
        #result { padding: 15px; font-size: 1.2rem; font-weight: bold; background: #e9ecef; border-radius: 8px; color: #212529; }
        #status { font-size: 0.9rem; color: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h2>ماسح البطاقات المباشر</h2>
    <p id="status">جاري تشغيل الكاميرا...</p>
    
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <button id="scanBtn" onclick="scanNow()">التقاط وقراءة النص مباشرة</button>
    
    <div id="result">النتيجة: ---</div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusText = document.getElementById('status');
const resultText = document.getElementById('result');
const scanBtn = document.getElementById('scanBtn');

// 1. تشغيل الكاميرا فور فتح الصفحة
async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        statusText.innerText = "الكاميرا جاهزة. وجّه الكاميرا نحو البطاقة واضغط قراءة.";
    } catch (err) {
        statusText.innerText = "خطأ في فتح الكاميرا: " + err.message;
    }
}

// 2. التقاط الصورة الحالية وقراءتها مباشرة بدون أي معالجة
async function scanNow() {
    scanBtn.disabled = true;
    statusText.innerText = "جاري التقاط الصورة وقراءة النص...";
    resultText.innerText = "النتيجة: جاري المعالجة...";

    // رسم الإطار الحالي على الكانفاس
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    try {
        // تشغيل Tesseract مباشرة على الكانفاس
        const result = await Tesseract.recognize(canvas, 'eng', {
            logger: m => {
                if(m.status === 'recognizing text') {
                    statusText.innerText = `جاري القراءة... (${Math.round(m.progress * 100)}%)`;
                }
            }
        });

        const rawText = result.data.text;
        console.log("النصر المقروء الكامل:", rawText);

        // البحث عن النمط JED-XXX-XXXX
        // قبول مسافات أو أخطاء بسيطة مثل JED-123-4567
        const regex = /JED\s*[-–—]?\s*\d{3}\s*[-–—]?\s*\d{4}/gi;
        const match = rawText.match(regex);

        if (match && match.length > 0) {
            // تنسيق النتيجة بالشكل الصحيح
            let cleanNumber = match[0].replace(/\s+/g, '').toUpperCase();
            if(!cleanNumber.includes('-')) {
                cleanNumber = cleanNumber.replace(/JED(\d{3})(\d{4})/, "JED-$1-$2");
            }
            resultText.innerText = "الرقم المستخرج: " + cleanNumber;
            statusText.innerText = "تمت القراءة بنجاح!";
        } else {
            resultText.innerText = "لم يتم العثور على الرقم بالنمط المطلوبة.";
            statusText.innerText = "تأكد من إضاءة الغرفة ووضوح الرقم أمام الكاميرا.";
        }
    } catch (err) {
        console.error(err);
        statusText.innerText = "حدث خطأ أثناء القراءة: " + err.message;
    } finally {
        scanBtn.disabled = false;
    }
}

initCamera();
</script>

</body>
</html>
